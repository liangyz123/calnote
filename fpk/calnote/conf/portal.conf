# 日历便签桌面入口的配置：改完在应用中心里「重启」这个应用就生效
# 手机上点桌面图标打不开？就是这里没指到你手机能访问的那个地址。
# 你的便签外网地址是 https://<你的飞牛外网域名>，所以默认按它来：
TARGET_HOST=            # 填你的飞牛外网域名，例：nas.example.com（留空=跟浏览器地址走，只适合内网）
TARGET_SCHEME=https
TARGET_PORT=443
# 如果只想在内网用（手机连的是家里 WiFi），把上面三行改成：
#   TARGET_HOST=        （留空=自动跟浏览器地址走）
#   TARGET_SCHEME=http
#   TARGET_PORT=8000
# 这个跳转入口自己的端口（桌面图标打开的就是它，不用动）
PORT=8010
